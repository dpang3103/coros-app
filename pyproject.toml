[project]
name = "running-platform"
version = "0.1.0"
description = "Learning project: running data ingestion, features, models and serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "fitdecode>=0.11.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/running_platform"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["running_platform"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fitdecode.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
